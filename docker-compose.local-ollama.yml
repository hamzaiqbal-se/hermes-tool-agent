version: "3.8"
services:
  ollama-local:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      # No paid API; local open-weight inference only; cloud endpoint not included (openrouter free tier not verified).
    command: ["serve"]
volumes:
  ollama-data:
